services:
  postgres:
    image: postgres:16-alpine
    container_name: workflow-postgres
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: joe@22
      POSTGRES_DB: workflowdb
    ports:
      - "5432:5432"
    volumes:
      - workflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflowdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: workflow-redis
    ports:
      - "6379:6379"
    volumes:
      - workflow_redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: workflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: workflow
      RABBITMQ_DEFAULT_PASS: joe@22
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Workflow.Api/Dockerfile
    container_name: workflow-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__WorkflowDb: Host=postgres;Port=5432;Database=workflowdb;Username=workflow;Password=joe@22
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMq: amqp://workflow:joe%4022@rabbitmq:5672
      Jwt__Issuer: Workflow.Api
      Jwt__Audience: Workflow.Client
      Jwt__SigningKey: "change-this-to-a-long-random-secret-at-least-32-chars"
      Jwt__AccessTokenMinutes: "60"
      Jwt__RefreshTokenDays: "14"
      OpenTelemetry__ServiceName: workflow-api
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: workflow-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: workflow-jaeger
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: workflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro

volumes:
  workflow_pgdata:
  workflow_redisdata:
